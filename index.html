<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Квадрокоптеры DJI</title>
</head>
<body>
        <header class="dji__header">
            <div class="container">
                <a href="#"><img src="./imgs/logo.svg" alt="dji-logo" class="header__logo"></a>
                <div class="header__search">
                    <input type="text" class="header__input" placeholder="Search">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-search preview-icon search__logo">
                        <path d="m21 21-4.34-4.34" />
                        <circle cx="11" cy="11" r="8" />
                    </svg>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-shopping-cart preview-icon cart__logo">
                    <path d="m2.05 2.05 1.099-.028a1 1 0 0 1 1.008.815l2.69 14.347A1 1 0 0 0 7.83 18H18" />
                    <path d="M4.563 5h16.435a1 1 0 0 1 .981 1.204l-1.026 6.226A2 2 0 0 1 18.962 14H6.25" />
                    <circle cx="18" cy="20" r="2" />
                    <circle cx="8" cy="20" r="2" />
                </svg>
            </div>
        </header>

        <div class="products container">
            <ul class="products__list">
            </ul>
            <div class="products__pages">
                <button class="btn-pages pages__prev"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"
                        stroke-linejoin="round" class="lucide lucide-chevron-left preview-icon">
                        <path d="m15 18-6-6 6-6" />
                    </svg></button>
                <ul class="pages__list">
                    <li class="pages__item">
                    </li>
                </ul>
                <button class="btn-pages pages__next"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"
                        stroke-linejoin="round" class="lucide lucide-chevron-right preview-icon">
                        <path d="m9 18 6-6-6-6" />
                    </svg></button>
            </div>
            <div class="window__overlay"></div>
            <div class="products__cart">
                <h5 class="cart__title">Your order</h5>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-x preview-icon products__close">
                    <path d="M18 6 6 18" />
                    <path d="m6 6 12 12" />
                </svg>
                <ul class="cart__list">
                    <li class="cart__item">
                        <img src="./imgs/products/quadcopters/quadcopter0001-front-view.jpg" alt="item-avatar"
                            class="cart__img">
                        <h6 class="item__name">DJI Mavic 3</h6>
                        <div class="item__control">
                            <button class="btn-control item__rm">&#8722</button>
                            <span class="item__quantity">1</span>
                            <button class="btn-control item__add">&#43</button>
                        </div>
                        <span class="item__cost">3290 $</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-x preview-icon icon-close">
                            <path d="M18 6 6 18" />
                            <path d="m6 6 12 12" />
                        </svg>
                    </li>
                    <li class="cart__item">
                        <img src="./imgs/products/quadcopters/quadcopter0002-front-view.jpg" alt="item-avatar"
                            class="cart__img">
                        <h6 class="item__name">DJI Mavic 3</h6>
                        <div class="item__control">
                            <button class="btn-control item__rm">&#8722</button>
                            <span class="item__quantity">1</span>
                            <button class="btn-control item__add">&#43</button>
                        </div>
                        <span class="item__cost">3290 $</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-x preview-icon icon-close">
                            <path d="M18 6 6 18" />
                            <path d="m6 6 12 12" />
                        </svg>
                    </li>

                </ul>
                <div class="total__wrap">
                    <div class="total__info">
                        <span class="total__title">Total</span>
                        <span class="total__cost">10 000 $</span>
                    </div>
                    <button class="btn btn-order">Place order</button>
                </div>
            </div>
        </div>
    <script src="./script.js"></script>
</body>
</html>
